<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolTitan Matrix</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin-top: 30%;
        }
        h1 {
            color: #a78bfa;
        }
        .wallet-btn {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            margin-top: 20px;
        }
        .wallet-btn:hover {
            background-color: #7c3aed;
        }
        #walletAddress {
            margin-top: 20px;
            color: #10b981;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>Welcome to PolTitan Matrix</h1>
    <p>A Decentralized Polygon DApp</p>
    
    <!-- Connect Wallet Button -->
    <button class="wallet-btn" id="connectWalletBtn">Connect Wallet</button>
    
    <p id="walletAddress"></p>

    <!-- Web3 Javascript Logic -->
    <script>
        const connectBtn = document.getElementById('connectWalletBtn');
        const walletAddressDisplay = document.getElementById('walletAddress');

        connectBtn.addEventListener('click', async () => {
            // Check if MetaMask or Trust Wallet is injected
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Request account access
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    
                    // Change Button UI after successful connection
                    walletAddressDisplay.innerText = "Connected: " + account.substring(0, 6) + "..." + account.substring(account.length - 4);
                    connectBtn.innerText = "Wallet Connected";
                    connectBtn.style.backgroundColor = "#10b981"; // Green color
                } catch (error) {
                    console.error("Connection rejected", error);
                }
            } else {
                alert("Please open this link inside MetaMask or Trust Wallet DApp browser!");
            }
        });
    </script>
</body>
</html>
