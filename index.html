<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolTitan Matrix</title>
    <!-- Ethers.js Library -->
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin-top: 10%;
        }
        h1 { color: #a78bfa; }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .btn {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background-color: #7c3aed; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
        
        #registerBtn { background-color: #3b82f6; display: none; }
        #registerBtn:hover { background-color: #2563eb; }
        
        #copyRefBtn { background-color: #f59e0b; display: none; margin-top: 10px; font-size: 14px;}
        #copyRefBtn:hover { background-color: #d97706; }

        .text-green { color: #10b981; font-weight: bold; margin-top: 10px;}
        .text-red { color: #ef4444; font-weight: bold; margin-top: 10px;}
        
        .input-group {
            margin-top: 15px;
            text-align: left;
            display: none;
        }
        .input-group label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
            display: block;
        }
        .input-group input {
            width: 90%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 14px;
        }
        .input-group input:read-only {
            background-color: #334155;
            color: #a78bfa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>PolTitan Matrix</h1>
        <p>Decentralized 30 POL Plan</p>
        
        <!-- Connect Wallet Button -->
        <button class="btn" id="connectWalletBtn">Connect Wallet</button>
        <p class="text-green" id="walletAddress"></p>

        <!-- Upline Input Box -->
        <div class="input-group" id="uplineGroup">
            <label>Referral / Upline Address:</label>
            <input type="text" id="uplineInput" placeholder="Enter valid Upline Address">
        </div>

        <!-- Register Button -->
        <button class="btn" id="registerBtn">Register Matrix (30 POL)</button>
        <p id="statusMsg"></p>

        <!-- Copy Referral Link -->
        <button class="btn" id="copyRefBtn">📋 Copy My Referral Link</button>
    </div>

    <script>
        // Aapka Contract Address
        const CONTRACT_ADDRESS = "0xa7C92BDcFA2FdD708FCB59660343Eba47f01947B";
        const CONTRACT_ABI = [
            "function register(address _upline) external payable"
        ];

        let provider, signer, contract, userAddress;

        const connectBtn = document.getElementById('connectWalletBtn');
        const registerBtn = document.getElementById('registerBtn');
        const copyRefBtn = document.getElementById('copyRefBtn');
        const walletAddressDisplay = document.getElementById('walletAddress');
        const statusMsg = document.getElementById('statusMsg');
        const uplineGroup = document.getElementById('uplineGroup');
        const uplineInput = document.getElementById('uplineInput');

        // URL me se referral nikalne ka code
        const urlParams = new URLSearchParams(window.location.search);
        const refFromUrl = urlParams.get('ref');

        // 1. Connect Wallet Logic
        connectBtn.addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    // Update UI
                    walletAddressDisplay.innerText = "Connected: " + userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    connectBtn.style.display = "none"; 
                    
                    // Show Upline Input Box
                    uplineGroup.style.display = "block";
                    
                    // Agar link me Referral valid hai, to usko box me daal kar Lock kar do
                    if (refFromUrl && refFromUrl.length === 42 && refFromUrl.startsWith("0x")) {
                        uplineInput.value = refFromUrl;
                        uplineInput.readOnly = true; 
                    }
                    
                    registerBtn.style.display = "block"; 
                    copyRefBtn.style.display = "block"; 
                    
                } catch (error) {
                    console.error("Connection failed", error);
                    statusMsg.innerText = "Wallet connection failed!";
                    statusMsg.className = "text-red";
                }
            } else {
                alert("Please open this link inside MetaMask or Trust Wallet DApp browser!");
            }
        });

        // 2. Register Logic (Strict Check ke sath)
        registerBtn.addEventListener('click', async () => {
            const finalUplineAddress = uplineInput.value.trim();

            // Check: Bina Upline ke register nahi hone dega
            if (!finalUplineAddress || finalUplineAddress.length !== 42 || !finalUplineAddress.startsWith("0x")) {
                statusMsg.innerText = "Error: Please enter a valid Referral Upline Address!";
                statusMsg.className = "text-red";
                return;
            }

            // Check: Koi khud ki hi link se join na kar le
            if (finalUplineAddress.toLowerCase() === userAddress.toLowerCase()) {
                statusMsg.innerText = "Error: You cannot be your own Upline!";
                statusMsg.className = "text-red";
                return;
            }

            try {
                statusMsg.innerText = "Waiting for transaction approval...";
                statusMsg.className = "text-green";
                registerBtn.disabled = true;

                const amountInWei = ethers.utils.parseEther("30.0");
                
                const tx = await contract.register(finalUplineAddress, { value: amountInWei });
                statusMsg.innerText = "Transaction pending on blockchain...";
                
                await tx.wait();
                
                statusMsg.innerText = "Registration Successful! Welcome to PolTitan!";
                statusMsg.className = "text-green";
                registerBtn.style.display = "none"; 
                uplineGroup.style.display = "none";

            } catch (error) {
                console.error("Transaction failed", error);
                statusMsg.innerText = "Transaction Failed or Rejected.";
                statusMsg.className = "text-red";
                registerBtn.disabled = false;
            }
        });

        // 3. Copy Referral Link Logic
        copyRefBtn.addEventListener('click', () => {
            if (userAddress) {
                const myLink = window.location.origin + window.location.pathname + "?ref=" + userAddress;
                navigator.clipboard.writeText(myLink).then(() => {
                    alert("Referral Link Copied!\n" + myLink);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                });
            }
        });
    </script>
</body>
</html>
