<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolTitan Matrix Dashboard</title>
    <!-- Cloudflare Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="application/javascript"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #a78bfa; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
        
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .btn {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover { background-color: #7c3aed; }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }
        
        #registerBtn { background-color: #3b82f6; }
        #registerBtn:hover { background-color: #2563eb; }
        .copy-btn { background-color: #f59e0b; margin-top: 15px; }
        .copy-btn:hover { background-color: #d97706; }

        .text-green { color: #10b981; font-weight: bold; margin-top: 10px;}
        .text-red { color: #ef4444; font-weight: bold; margin-top: 10px;}
        
        .input-group { text-align: left; margin-top: 15px; }
        .input-group label { font-size: 14px; color: #94a3b8; margin-bottom: 5px; display: block; }
        .input-group input {
            width: 90%; padding: 10px; border-radius: 5px;
            border: 1px solid #475569; background-color: #0f172a;
            color: white; font-size: 14px;
        }
        .input-group input:read-only { background-color: #334155; color: #a78bfa; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .stat-title { font-size: 12px; color: #94a3b8; }
        .stat-value { font-size: 24px; font-weight: bold; color: #10b981; margin-top: 5px; }
        .stat-value.purple { color: #a78bfa; }

        #registerSection, #dashboardSection { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PolTitan</h1>
        <p class="subtitle">Decentralized Matrix Plan</p>
        
        <!-- Login/Connect Section -->
        <button class="btn" id="connectWalletBtn">Connect Wallet</button>
        <p class="text-green" id="walletAddress"></p>
        <p id="statusMsg"></p>

        <!-- 1. REGISTRATION SECTION -->
        <div id="registerSection">
            <div class="input-group">
                <label>Referral / Upline Address:</label>
                <input type="text" id="uplineInput" placeholder="Enter Upline Address">
            </div>
            <button class="btn" id="registerBtn">Register Matrix (30 POL)</button>
        </div>

        <!-- 2. DASHBOARD SECTION -->
        <div id="dashboardSection">
            <h3 style="color: white; border-bottom: 1px solid #334155; padding-bottom: 10px;">My Dashboard</h3>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-title">My ID</div>
                    <div class="stat-value purple" id="displayId">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Current Slot</div>
                    <div class="stat-value" id="displaySlot">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Direct Team</div>
                    <div class="stat-value" id="displayDirects">--</div>
                </div>
                <div class="stat-box">
                    <div class="stat-title">Hold Amount</div>
                    <div class="stat-value" id="displayHold">0.0</div>
                </div>
            </div>

            <button class="btn copy-btn" id="copyRefBtn">📋 Copy Referral Link</button>
        </div>

    </div>

    <script>
        const CONTRACT_ADDRESS = "0xa7C92BDcFA2FdD708FCB59660343Eba47f01947B";
        const CONTRACT_ABI = [
            "function register(address _upline) external payable",
            "function users(address) external view returns (uint256 id, address wallet, address upline, uint256 directCount, uint256 currentSlot, uint256 holdAmount, bool isRealID, address leftDirect, address rightDirect, uint256 slot2TeamCount)"
        ];

        let provider, signer, contract, userAddress;

        const connectBtn = document.getElementById('connectWalletBtn');
        const walletAddressDisplay = document.getElementById('walletAddress');
        const statusMsg = document.getElementById('statusMsg');
        
        const registerSection = document.getElementById('registerSection');
        const dashboardSection = document.getElementById('dashboardSection');
        
        const uplineInput = document.getElementById('uplineInput');
        const registerBtn = document.getElementById('registerBtn');
        const copyRefBtn = document.getElementById('copyRefBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const refFromUrl = urlParams.get('ref');

        connectBtn.addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusMsg.innerText = "Connecting...";
                    statusMsg.className = "";
                    
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    
                    provider = new ethers.providers.Web3Provider(window.ethereum, "any");
                    
                    // Network Check (Ensure Polygon Mainnet - ChainID 137)
                    const network = await provider.getNetwork();
                    if (network.chainId !== 137) {
                        alert("Bhai, MetaMask wrong network par hai! Please switch to 'Polygon Mainnet' in MetaMask.");
                        statusMsg.innerText = "Error: Wrong Network! Switch to Polygon.";
                        statusMsg.className = "text-red";
                        return;
                    }

                    signer = provider.getSigner();
                    contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                    walletAddressDisplay.innerText = "Connected: " + userAddress.substring(0, 6) + "..." + userAddress.substring(userAddress.length - 4);
                    connectBtn.style.display = "none"; 
                    statusMsg.innerText = "Loading Dashboard...";
                    statusMsg.className = "text-green";

                    // Fetch user data securely
                    const userInfo = await contract.users(userAddress);
                    
                    // Ethers returns struct data as an array/object. Index 0 is 'id'.
                    const userId = userInfo[0].toNumber(); 

                    if (userId > 0) {
                        // User exists
                        statusMsg.innerText = "";
                        document.getElementById('displayId').innerText = userId;
                        document.getElementById('displaySlot').innerText = userInfo[4].toNumber(); // currentSlot
                        document.getElementById('displayDirects').innerText = userInfo[3].toNumber(); // directCount
                        document.getElementById('displayHold').innerText = ethers.utils.formatEther(userInfo[5]); // holdAmount
                        
                        dashboardSection.style.display = "block";
                    } else {
                        // New User
                        statusMsg.innerText = "";
                        registerSection.style.display = "block";
                        
                        if (refFromUrl && refFromUrl.length === 42) {
                            uplineInput.value = refFromUrl;
                            uplineInput.readOnly = true; 
                        }
                    }
                    
                } catch (error) {
                    console.error(error);
                    alert("Dashboard Load Error: " + (error.message || JSON.stringify(error)));
                    statusMsg.innerText = "Connection failed!";
                    statusMsg.className = "text-red";
                }
            } else {
                alert("Please open this in MetaMask!");
            }
        });

        registerBtn.addEventListener('click', async () => {
            const finalUpline = uplineInput.value.trim();
            if (!finalUpline || finalUpline.length !== 42) {
                statusMsg.innerText = "Error: Invalid Upline Address!";
                statusMsg.className = "text-red"; return;
            }
            if (finalUpline.toLowerCase() === userAddress.toLowerCase()) {
                statusMsg.innerText = "Error: Cannot be your own Upline!";
                statusMsg.className = "text-red"; return;
            }

            try {
                statusMsg.innerText = "Waiting for approval...";
                statusMsg.className = "text-green";
                registerBtn.disabled = true;

                const tx = await contract.register(finalUpline, { value: ethers.utils.parseEther("30.0") });
                statusMsg.innerText = "Transaction pending...";
                await tx.wait();
                
                window.location.reload();

            } catch (error) {
                console.error(error);
                alert("Transaction Error: " + (error.message || JSON.stringify(error)));
                statusMsg.innerText = "Transaction Failed!";
                statusMsg.className = "text-red";
                registerBtn.disabled = false;
            }
        });

        copyRefBtn.addEventListener('click', () => {
            const myLink = window.location.origin + window.location.pathname + "?ref=" + userAddress;
            navigator.clipboard.writeText(myLink).then(() => {
                alert("Link Copied! \n" + myLink);
            });
        });
    </script>
</body>
</html>
